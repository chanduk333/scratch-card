<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Best Price Guru | 3D Scratch Card</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #FF6B00; /* Instamart Orange */
            --secondary: #2E7D32; /* Deep Green */
            --bg-color: #e0e5ec;
            --card-bg: #f0f0f3;
            --shadow-light: #ffffff;
            --shadow-dark: #aeaec0;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--bg-color);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            perspective: 1000px; /* Essential for 3D */
        }

        /* 3D Container */
        .scene {
            width: 340px;
            height: 600px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-3d {
            width: 100%;
            background: var(--card-bg);
            border-radius: 30px;
            padding: 25px;
            position: relative;
            transform-style: preserve-3d; /* Makes children 3D */
            box-shadow: 20px 20px 60px var(--shadow-dark), 
                       -20px -20px 60px var(--shadow-light);
            transition: transform 0.1s ease-out;
            border: 1px solid rgba(255,255,255,0.5);
        }

        /* 3D Floating Elements */
        .float-element {
            transform: translateZ(30px); /* Pushes element 'out' of the card */
            text-align: center;
        }

        h2 {
            color: var(--primary);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            margin-bottom: 5px;
        }

        .sub-text {
            color: var(--secondary);
            font-weight: bold;
            font-size: 12px;
            background: rgba(46, 125, 50, 0.1);
            padding: 5px 15px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 20px;
        }

        /* Neumorphic Inputs (Inset 3D look) */
        input {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: none;
            border-radius: 15px;
            background: var(--card-bg);
            box-shadow: inset 5px 5px 10px var(--shadow-dark), 
                        inset -5px -5px 10px var(--shadow-light);
            font-size: 16px;
            color: #555;
            box-sizing: border-box;
            transition: 0.3s;
        }
        input:focus { outline: none; box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -2px -2px 5px var(--shadow-light); }

        /* 3D Button */
        .btn-3d {
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            border: none;
            border-radius: 15px;
            background: linear-gradient(145deg, #ff721a, #e66000);
            color: white;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 5px 5px 15px rgba(255, 107, 0, 0.4), 
                       -5px -5px 15px var(--shadow-light);
            cursor: pointer;
            transition: 0.2s;
            transform: translateZ(40px); /* Stick out more */
        }
        .btn-3d:active {
            transform: translateZ(35px) scale(0.98); /* Press effect */
            box-shadow: inset 3px 3px 8px rgba(0,0,0,0.2);
        }

        /* Scratch Area Frame */
        #gameArea { display: none; margin-top: 20px; transform: translateZ(20px); }
        
        .scratch-frame {
            position: relative;
            width: 300px;
            height: 160px;
            margin: 0 auto;
            border-radius: 15px;
            background: #fff;
            padding: 5px;
            box-shadow: inset 3px 3px 8px rgba(0,0,0,0.1), 
                        5px 5px 15px rgba(0,0,0,0.1);
        }

        #prizeUnder {
            width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: repeating-linear-gradient(
                45deg,
                #fff,
                #fff 10px,
                #f8f8f8 10px,
                #f8f8f8 20px
            );
            color: var(--secondary);
            font-size: 24px;
            font-weight: 900;
            border-radius: 10px;
        }

        canvas { border-radius: 10px; cursor: pointer; }

        /* Result Screen */
        #resultArea { display: none; transform: translateZ(50px); animation: popUp 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55); }
        @keyframes popUp { 0% { transform: scale(0.5) translateZ(0); opacity: 0; } 100% { transform: scale(1) translateZ(50px); opacity: 1; } }

        .prize-display {
            font-size: 32px;
            color: var(--primary);
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
            margin: 20px 0;
            font-weight: 900;
        }
        
        .error-msg { color: red; font-size: 12px; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<div class="scene">
    <div class="card-3d" id="tiltCard">
        
        <div class="float-element">
            <h2>Best Price Guru</h2>
            <div class="sub-text">VINUKONDA • INSTAMART</div>
        </div>

        <div id="loginForm" class="float-element">
            <input type="text" id="name" placeholder="👤 Full Name">
            <input type="tel" id="whatsapp" placeholder="📱 WhatsApp Number">
            <input type="text" id="city" placeholder="📍 City / Area">
            
            <button class="btn-3d" onclick="verifyUser()" id="playBtn">SCRATCH NOW 🎲</button>
            <div id="error" class="error-msg"></div>
            <p style="font-size: 10px; margin-top: 15px; color: #888;">Limited: 1000 Coupons Only</p>
        </div>

        <div id="gameArea">
            <div class="scratch-frame">
                <div id="prizeUnder">
                    <span style="font-size: 40px;">🎁</span>
                    <span id="prizeCode">???</span>
                </div>
                <canvas id="scratchCanvas" width="290" height="150" style="position: absolute; top: 5px; left: 5px;"></canvas>
            </div>
            <p style="font-size: 11px; color: #777; margin-top: 10px; text-align: center;">Move finger to scratch!</p>
        </div>

        <div id="resultArea" class="float-element">
            <h1 style="color: var(--secondary); margin: 0;">YOU WON!</h1>
            <div class="prize-display" id="finalDisplay"></div>
            
            <div style="background: rgba(255,255,255,0.6); padding: 10px; border-radius: 10px; font-size: 11px; color: #555; text-align: left; box-shadow: inset 2px 2px 5px rgba(0,0,0,0.05);">
                <b>📝 Terms & Conditions:</b><br>
                • Min Purchase ₹1000<br>
                • Not valid on Oil/Rice/Ghee<br>
                • Show screenshot at counter
            </div>
            
            <button class="btn-3d" onclick="location.reload()" style="background: linear-gradient(145deg, #2E7D32, #1B5E20);">Done</button>
        </div>

    </div>
</div>

<audio id="scratchSound" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3" loop></audio>

<script>
    // 🔴 PASTE YOUR GOOGLE APPS SCRIPT URL HERE
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzEHSUm4bfuPNYSB8sHEk6xWgRqPpGm4H9plvtwgt4HFqPcKAW6tQnCYOjoM0xH6_9KEg/exec';

    // --- 3D TILT EFFECT LOGIC ---
    const card = document.getElementById('tiltCard');
    const scene = document.querySelector('.scene');

    // Mouse Movement
    scene.addEventListener('mousemove', (e) => {
        const xAxis = (window.innerWidth / 2 - e.pageX) / 15; // Rotate X axis
        const yAxis = (window.innerHeight / 2 - e.pageY) / 15; // Rotate Y axis
        card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
    });

    // Reset on Leave
    scene.addEventListener('mouseleave', () => {
        card.style.transform = `rotateY(0deg) rotateX(0deg)`;
    });

    // Mobile Gyroscope (Optional - works on supported phones)
    window.addEventListener('deviceorientation', (e) => {
        if (window.innerWidth < 800) { // Only on mobile
            const y = (e.gamma) / 2; // Left/Right tilt
            const x = (e.beta - 45) / 2; // Forward/Back tilt
            card.style.transform = `rotateY(${y}deg) rotateX(${x}deg)`;
        }
    });

    // --- GAME LOGIC ---
    let winningPrize = "";

    function verifyUser() {
        const name = document.getElementById('name').value;
        const whatsapp = document.getElementById('whatsapp').value;
        const city = document.getElementById('city').value;
        const btn = document.getElementById('playBtn');
        const err = document.getElementById('error');

        if(!name || !whatsapp || !city) {
            err.innerText = "Please fill all fields!"; err.style.display = 'block'; return;
        }

        btn.innerText = "VERIFYING... ⏳";
        btn.disabled = true;

        fetch(scriptURL, {
            method: 'POST',
            body: JSON.stringify({ name, whatsapp, city })
        })
        .then(res => res.json())
        .then(data => {
            if(data.status === 'error') {
                err.innerText = data.message;
                err.style.display = 'block';
                btn.innerText = "TRY AGAIN ❌";
                btn.disabled = false;
            } else {
                winningPrize = data.prize;
                document.getElementById('prizeCode').innerText = winningPrize;
                document.getElementById('finalDisplay').innerText = winningPrize;
                
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('gameArea').style.display = 'block';
                initScratch();
            }
        })
        .catch(e => {
            err.innerText = "Connection Error"; err.style.display = 'block'; btn.disabled = false;
        });
    }

    function initScratch() {
        const canvas = document.getElementById('scratchCanvas');
        const ctx = canvas.getContext('2d');
        const sound = document.getElementById('scratchSound');

        // 3D Metallic Gradient Layer
        let grd = ctx.createLinearGradient(0, 0, 300, 160);
        grd.addColorStop(0, "#BDC3C7");
        grd.addColorStop(0.5, "#2C3E50");
        grd.addColorStop(1, "#BDC3C7");
        ctx.fillStyle = grd;
        ctx.fillRect(0, 0, 300, 160);

        // Add 'Sparkle' dots
        ctx.fillStyle = "#FFF";
        for(let i=0; i<50; i++) ctx.fillRect(Math.random()*300, Math.random()*160, 2, 2);

        // Text overlay
        ctx.font = "bold 20px Segoe UI";
        ctx.fillStyle = "#FFF";
        ctx.fillText("SCRATCH HERE", 75, 80);

        let isDrawing = false;
        let points = 0;

        const start = () => { isDrawing = true; sound.play().catch(e=>{}); };
        const end = () => { isDrawing = false; sound.pause(); };
        
        const move = (e) => {
            if(!isDrawing) return;
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
            const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;

            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.arc(x, y, 20, 0, Math.PI * 2);
            ctx.fill();

            points++;
            if(points > 150) finishGame();
        }

        canvas.addEventListener('mousedown', start);
        canvas.addEventListener('touchstart', start);
        window.addEventListener('mousemove', move);
        canvas.addEventListener('touchmove', move);
        window.addEventListener('mouseup', end);
        window.addEventListener('touchend', end);
    }

    let done = false;
    function finishGame() {
        if(done) return;
        done = true;
        setTimeout(() => {
            document.getElementById('gameArea').style.display = 'none';
            document.getElementById('resultArea').style.display = 'block';
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
        }, 500);
    }
</script>

</body>
</html>
